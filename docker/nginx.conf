server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 目录补斜杠时使用相对跳转，避免容器内 80 端口被写进 Location
    # （否则经 8080 端口映射/反向代理会跳到 localhost:80 而打不开）
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # Nuxt 构建产物带内容哈希，可永久缓存
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 兜底：无扩展名的路径回退到 200.html
    location / {
        try_files $uri $uri.html $uri/ /200.html;
    }

    error_page 404 /404.html;
}
